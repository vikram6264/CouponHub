<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — CouponShare</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-box">
    <a href="index.html" class="nav-brand" style="display:block;margin-bottom:1.5rem;font-family:'DM Sans',sans-serif;font-size:22px;font-weight:600;text-decoration:none;color:var(--purple)">Coupon<span style="color:var(--green)">Share</span></a>
    <h2>Welcome back</h2>
    <p class="subtitle">Login to your account to claim deals and earn points</p>

    <div id="form-alert" class="alert alert-error"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Email / Username</label>
        <input type="text" id="email" placeholder="you@example.com or username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" tabindex="-1" onclick="togglePw('password', this)" aria-label="Show password">👁</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Login</button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="register.html">Sign up free</a>
    </div>
  </div>
</div>

<script src="api.js"></script>
<script src="auth.js"></script>
<script>
function togglePw(inputId, btn) {
  const input = document.getElementById(inputId);
  const showing = input.type === 'text';
  input.type = showing ? 'password' : 'text';
  btn.textContent = showing ? '👁' : '🙈';
  btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
}

document.addEventListener('DOMContentLoaded', () => {
  if (isLoggedIn()) { window.location.href = 'browse.html'; return; }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideAlert('form-alert');
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true; btn.innerHTML = '<div class="spinner"></div> Logging in...';

    try {
      const data = await Auth.login({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value
      });
      saveLogin(data);
      window.location.href = data.user.is_admin ? 'admin.html' : 'browse.html';
    } catch (err) {
      showAlert('form-alert', err.message);
      btn.disabled = false; btn.textContent = 'Login';
    }
  });
});
</script>
</body>
</html>
