<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CouponShare — Browse Coupons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══════════════════ NAVBAR ══════════════════════ -->
<div id="navbar-root"></div>
<script src="api.js"></script>
<script src="auth.js"></script>
<script src="navbar.js"></script>
<script>renderNavbar('browse');</script>

<!-- ═══════════════════ SEARCH ══════════════════════ -->
<div class="search-section">
  <div class="search-row">
    <input class="search-box" id="searchInput" type="search"
      placeholder="Search coupons — Swiggy, Amazon, Paytm..."
      aria-label="Search coupons"
      oninput="onSearch()">
    <button class="filter-btn" onclick="toggleFilterPanel()" aria-label="Filters">
      <span class="filter-icon">⚙</span> Filter
    </button>
  </div>
</div>

<!-- ═══════════════════ CATEGORIES ══════════════════ -->
<div class="cats-row" id="catsRow">
  <button class="cat active" onclick="selCat(this,'')">All</button>
</div>

<!-- ═══════════════════ STATS ═══════════════════════ -->
<div class="stats-section">
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-num purple" id="statTotal">—</div>
      <div class="stat-lbl">Active coupons</div>
    </div>
    <div class="stat-card">
      <div class="stat-num teal" id="statClaims">—</div>
      <div class="stat-lbl">Claimed today</div>
    </div>
    <div class="stat-card">
      <div class="stat-num amber" id="statSavings">—</div>
      <div class="stat-lbl">Total savings</div>
    </div>
  </div>
</div>

<!-- ═══════════════════ COUPON GRID ═════════════════ -->
<div class="coupons-section">
  <div class="section-title">Latest coupons</div>
  <div class="coupons-grid" id="couponGrid">
    <div class="loader"><div class="spinner"></div> Loading coupons...</div>
  </div>
</div>

<!-- Load more -->
<div class="load-more-wrap" id="loadMoreWrap" style="display:none;">
  <button class="load-more-btn" onclick="loadMore()">Load more coupons</button>
</div>

<!-- ═══════════════════ CTA BANNER ══════════════════ -->
<div class="cta-banner" role="button" tabindex="0" onclick="window.location.href='submit.html'"
     onkeydown="if(event.key==='Enter')window.location.href='submit.html'">
  <div class="cta-icon-box">
    <div class="cta-icon-inner"></div>
  </div>
  <div class="cta-text">
    <h4>Aapke paas unused coupons hain?</h4>
    <p>Share karein — 5 points milenge har coupon ke liye ↗</p>
  </div>
</div>

<!-- ═══════════════════ CLAIM MODAL ═════════════════ -->
<div class="overlay" id="claimOverlay" onclick="overlayClick(event,'claimOverlay')">
  <div class="modal">
    <div class="modal-emoji">🎉</div>
    <div class="modal-title">Coupon Claimed!</div>
    <div class="modal-sub" id="claimModalSub">Platform — Discount</div>
    <div class="modal-codebox">
      <div class="modal-code" id="claimModalCode">CODE</div>
      <div class="modal-meta" id="claimModalMeta">Tap to copy</div>
    </div>
    <button class="btn-copy" onclick="copyAndClose()">📋 Copy code & close</button>
  </div>
</div>

<!-- LOGIN PROMPT MODAL -->
<div class="overlay" id="loginOverlay" onclick="overlayClick(event,'loginOverlay')">
  <div class="modal modal-narrow">
    <div class="modal-emoji">🔐</div>
    <div class="modal-title">Login karo pehle</div>
    <div class="modal-sub">Coupon claim karne ke liye login zaroori hai</div>
    <button class="btn-login" onclick="window.location.href='login.html'">Login</button>
    <button class="btn-cancel" onclick="closeOverlay('loginOverlay')">Cancel</button>
  </div>
</div>

<!-- ═══════════════════ TOAST ════════════════════════ -->
<div class="toast-container" id="toastContainer"></div>

<!-- ═══════════════════════════════════════════════════
     JAVASCRIPT
═══════════════════════════════════════════════════ -->
<script>
/* ── State ─────────────────────────────────── */
let currentPage = 1;
let currentCat = '';
let searchTimer = null;
let currentClaimCode = '';
let allPages = 1;
let demoMode = false;          // true when backend unreachable
const demoCodes = new Map();   // demo coupon id → code

/* ══════════════════════════════════════════════
   INIT
══════════════════════════════════════════════ */
function init() {
  loadChips();
  loadCoupons(true);
}

/* ── Dynamic category chips (same list as submit form) ── */
async function loadChips() {
  try {
    const res = await apiFetch('/api/categories');
    const data = await res.json();
    const row = document.getElementById('catsRow');
    (data.categories || []).forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'cat';
      btn.textContent = cat;
      btn.onclick = () => selCat(btn, cat);
      row.appendChild(btn);
    });
  } catch (e) { /* keep just the "All" chip */ }
}

/* ══════════════════════════════════════════════
   LOAD COUPONS
══════════════════════════════════════════════ */
async function loadCoupons(reset = false) {
  if (reset) {
    currentPage = 1;
    document.getElementById('couponGrid').innerHTML =
      '<div class="loader"><div class="spinner"></div> Loading coupons...</div>';
    document.getElementById('loadMoreWrap').style.display = 'none';
  }

  const params = new URLSearchParams({ page: currentPage });
  if (currentCat) params.set('category', currentCat);
  const search = document.getElementById('searchInput').value.trim();
  if (search) params.set('search', search);

  try {
    const res = await apiFetch('/api/coupons/browse?' + params);
    if (!res.ok) throw new Error('Request failed');
    const data = await res.json();

    demoMode = false;

    if (currentPage === 1) {
      document.getElementById('statTotal').textContent  = Number(data.total_active || 0).toLocaleString('en-IN');
      document.getElementById('statClaims').textContent = Number(data.claims_today || 0).toLocaleString('en-IN');
      document.getElementById('statSavings').textContent = formatSavings(data.total_savings || 0);
    }

    const grid = document.getElementById('couponGrid');
    if (currentPage === 1) grid.innerHTML = '';

    const coupons = data.coupons || [];
    if (coupons.length === 0 && currentPage === 1) {
      grid.innerHTML = `
        <div class="empty-state">
          <div class="big">🎫</div>
          <h3>Koi coupon nahi mila</h3>
          <p>Is category mein abhi koi active coupon nahi hai</p>
        </div>`;
      document.getElementById('loadMoreWrap').style.display = 'none';
      return;
    }

    coupons.forEach(c => grid.insertAdjacentHTML('beforeend', buildCard(c)));

    allPages = data.pages || 1;
    document.getElementById('loadMoreWrap').style.display =
      currentPage < allPages ? 'block' : 'none';

  } catch (err) {
    // Backend unreachable → demo data (honest label)
    loadDemoData();
    showToast('Backend offline — demo data shown', 'info');
  }
}

function formatSavings(n) {
  n = Number(n) || 0;
  if (n >= 100000) return '₹' + (n / 100000).toFixed(1).replace(/\.0$/, '') + 'L';
  if (n >= 1000)   return '₹' + (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
  return '₹' + n.toLocaleString('en-IN');
}

/* ── Demo data (when backend offline) ─────── */
function loadDemoData() {
  const demo = [
    {id:1, platform:'Paytm',   code:'PAY50NOW', discount:'₹50 off',  description:'On recharge of ₹199+',  expiry_date:futureDate(30), is_claimed_by_me:false, claim_count:3},
    {id:2, platform:'Swiggy',  code:'SWIG40',   discount:'40% off',  description:'Min order ₹299',        expiry_date:futureDate(14), is_claimed_by_me:false, claim_count:7},
    {id:3, platform:'Amazon',  code:'AMZ100',   discount:'₹100 off', description:'Electronics ₹999+',     expiry_date:futureDate(45), is_claimed_by_me:true,  claim_count:12},
    {id:4, platform:'Zomato',  code:'ZOM30',    discount:'30% off',  description:'Orders above ₹399',     expiry_date:futureDate(7),  is_claimed_by_me:false, claim_count:9},
    {id:5, platform:'Flipkart',code:'FLIP200',  discount:'₹200 off', description:'Fashion ₹999+',         expiry_date:futureDate(21), is_claimed_by_me:false, claim_count:4},
  ];

  demoMode = true;
  demoCodes.clear();
  demo.forEach(c => {
    demoCodes.set(c.id, c.code);
    c.code_hidden = c.code.slice(0, 2) + '****';
    if (c.is_claimed_by_me) c.code = c.code;
  });

  document.getElementById('statTotal').textContent  = '1,248';
  document.getElementById('statClaims').textContent = '342';
  document.getElementById('statSavings').textContent = '₹89K';

  const grid = document.getElementById('couponGrid');
  grid.innerHTML = '';
  demo.forEach(c => grid.insertAdjacentHTML('beforeend', buildCard(c)));
}

function futureDate(days) {
  const d = new Date();
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

/* ── Build one coupon card HTML ────────────── */
function buildCard(c) {
  const days = daysLeft(c.expiry_date);
  const expCls = days !== null && days <= 3 ? 'cc-expiry soon' : 'cc-expiry';
  const expTxt = days === null
    ? 'No expiry date'
    : days <= 0
      ? 'Expired'
      : days <= 3
        ? `⚠️ ${days} day${days === 1 ? '' : 's'} left`
        : `${days} days left`;

  const platCls = platformClass(c.platform);
  const isClaimed = !!c.is_claimed_by_me;
  const displayCode = isClaimed ? escapeHtml(c.code || '') : escapeHtml(c.code_hidden || '****');

  return `
    <div class="coupon-card" id="cc-${Number(c.id)}">
      <div class="cc-top">
        <span class="plat-badge ${platCls}">${escapeHtml(c.platform || 'Other')}</span>
        <div class="cc-discount">${escapeHtml(c.discount || 'DEAL')}</div>
        <div class="cc-desc">${escapeHtml(c.description || c.title || '')}</div>
        <div class="cc-codebox">
          <span class="cc-code">${displayCode}</span>
          <div class="cc-copy-icon" role="button" tabindex="0"
               onclick="copyCode(this.dataset.code)"
               data-code="${escapeHtml(isClaimed ? (c.code || '') : '')}"
               title="${isClaimed ? 'Copy code' : 'Claim to reveal'}">⧉</div>
        </div>
      </div>
      <div class="cc-bottom">
        <span class="${expCls}">
          <span class="exp-icon"></span> ${expTxt}
        </span>
        ${isClaimed
          ? `<button class="claim-btn claimed" disabled>✓ Claimed</button>`
          : `<button class="claim-btn" onclick="claimCouponFromCard(this)"
                     data-id="${Number(c.id)}"
                     data-platform="${escapeHtml(c.platform || '')}"
                     data-discount="${escapeHtml(c.discount || '')}">Claim</button>`
        }
      </div>
    </div>`;
}

function claimCouponFromCard(btn) {
  claimCoupon(btn.dataset.id, btn.dataset.platform, btn.dataset.discount);
}

/* ── Load more ─────────────────────────────── */
function loadMore() {
  currentPage++;
  loadCoupons(false);
}

/* ══════════════════════════════════════════════
   CLAIM
══════════════════════════════════════════════ */
async function claimCoupon(id, platform, discount) {
  if (!isLoggedIn()) {
    document.getElementById('loginOverlay').classList.add('open');
    return;
  }

  // Demo mode: reveal locally, no server involved
  if (demoMode) {
    const code = demoCodes.get(id) || 'DEMO-CODE';
    revealClaim(id, platform, discount, code);
    showToast('Claimed (demo): ' + code, 'info');
    return;
  }

  try {
    const res = await apiFetch(`/api/coupons/${id}/claim`, { method: 'POST' });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || 'Claim failed');
    revealClaim(id, platform, discount, data.code);
  } catch (err) {
    if (err instanceof TypeError) {
      // fetch() network failure
      showToast('Server se connect nahi ho paya', 'error');
    } else {
      showToast(err.message, 'error');
    }
  }
}

function revealClaim(id, platform, discount, code) {
  currentClaimCode = code;
  document.getElementById('claimModalSub').textContent = `${platform} — ${discount}`;
  document.getElementById('claimModalCode').textContent = code;
  document.getElementById('claimModalMeta').textContent = 'Tap to copy';
  document.getElementById('claimOverlay').classList.add('open');

  const card = document.getElementById('cc-' + id);
  if (card) {
    card.querySelector('.cc-code').textContent = code;
    const btn = card.querySelector('.claim-btn');
    if (btn) {
      btn.textContent = '✓ Claimed';
      btn.classList.add('claimed');
      btn.disabled = true;
    }
  }
}

function copyAndClose() {
  copyCode(currentClaimCode);
  closeOverlay('claimOverlay');
}

/* ══════════════════════════════════════════════
   SEARCH & FILTER
══════════════════════════════════════════════ */
function selCat(el, cat) {
  document.querySelectorAll('.cat').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  currentCat = cat;
  loadCoupons(true);
}

function onSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => loadCoupons(true), 380);
}

function toggleFilterPanel() {
  showToast('Filter panel — coming soon!', 'info');
}

/* ══════════════════════════════════════════════
   HELPERS (shared ones live in api.js)
══════════════════════════════════════════════ */
function copyCode(code) {
  if (!code) { showToast('Pehle coupon claim karo!', 'info'); return; }
  navigator.clipboard.writeText(code)
    .then(() => showToast('Code copied: ' + code, 'success'))
    .catch(() => {
      const ta = document.createElement('textarea');
      ta.value = code; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Code copied: ' + code, 'success');
    });
}

/* ── Modals ────────────────────────────────── */
function closeOverlay(id) {
  document.getElementById(id).classList.remove('open');
}
function overlayClick(e, id) {
  if (e.target.id === id) closeOverlay(id);
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.overlay.open').forEach(o => o.classList.remove('open'));
  }
});

/* ── Start ─────────────────────────────────── */
init();
</script>
</body>
</html>
